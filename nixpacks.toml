# ==============================================================================
# Nixpacks configuration for Coolify
# ==============================================================================
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "NITRO_PRESET=node-server NODE_OPTIONS='--max-old-space-size=1024' npm run build"
]

[start]
cmd = "NODE_ENV=production PORT=3000 HOST=0.0.0.0 node --max-old-space-size=384 .output/server/index.mjs"
